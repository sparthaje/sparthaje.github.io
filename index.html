<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shreepa Parthaje</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
    <link rel="stylesheet" href="styles/home.css">

    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon/favicon-16x16.png">
    <link rel="icon" href="img/favicon/favicon.ico">
</head>

<body>
    <div class="container">
        <!-- Header Images -->
        <div class="header-images">
            <img class="image-box square" src="img/landing/profile_small.jpeg" alt="Profile" />
            <div class="image-box rectangle">
                <video autoplay loop muted playsinline>
                    <source src="img/landing/bg_small.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div class="image-box rectangle">
                <video autoplay loop muted playsinline>
                    <source src="img/landing/racing_small.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>

        <!-- Two Column Content -->
        <div class="content-wrapper">
            <div class="left-column">
                <div class="header-content">
                    <h1>Shreepa Parthaje</h1>
                    <h3>Perception @ NVIDIA</h3>
                    <br />
                    <div class="social-links">
                        <a href="docs/resume.pdf"><button>CV</button></a>
                        <a href="https://github.com/sparthaje"><button><i class="fab fa-github"></i></button></a>
                        <a href="https://linkedin.com/in/shreepa"><button><i class="fab fa-linkedin"></i></button></a>
                        <a href="mailto:shreepa.parthaje@gmail.com"><button><i class="fa fa-envelope"></i></button></a>
                    </div>
                    <p id="biography" class="bio"></p>

                </div>
            </div>

            <div class="right-column">
                <section id="research-section">
                    <h2>Research</h2>
                    <div id="research-list" class="project-list"></div>
                </section>

                <section id="projects-section">
                    <h2>Projects</h2>
                    <div id="projects-list" class="project-list"></div>
                </section>
            </div>
        </div>

        <!-- Mobile Videos Section (shown only on mobile at bottom) -->
        <div class="mobile-videos">
            <div class="image-box rectangle">
                <video autoplay loop muted playsinline>
                    <source src="img/landing/bg-compresssed.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div class="image-box rectangle">
                <video autoplay loop muted playsinline>
                    <source src="img/landing/racing.mov" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>
    </div>

    <script src="scripts/home.js"></script>
</body>

</html>
